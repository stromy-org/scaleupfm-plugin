    providers:
    - claude
    capability: toolkit-connector
    reason: 'Hosted on the OAuth-gated ''toolkit'' MCP, which the plugin bundles as a Claude connector
      (Connectors tab, hosted sign-in); the other hosts have no hosted sign-in, so it stays Claude-only
      (Invariant #13).'
