name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Detect optional toolchains
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_node=true" >> "$GITHUB_OUTPUT"; else echo "has_node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f pyproject.toml ] && [ -f uv.lock ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f pyproject.toml ] && [ ! -f uv.lock ]; then
            echo "lock_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "lock_missing=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() && steps.detect.outputs.has_node == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (npm ci)
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.detect.outputs.has_node == 'true' }}
        run: npm ci
      - name: Audit with allowlist
        if: ${{ !cancelled() && steps.detect.outputs.has_node == 'true' }}
        run: python3 .github/scripts/check-npm-audit.py
      - name: Skip (no package.json)
        if: ${{ !cancelled() && steps.detect.outputs.has_node == 'false' }}
        run: echo "No package.json present — Node audit is not applicable."
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: ${{ !cancelled() && steps.detect.outputs.has_python == 'true' }}
        with:
          version: '0.11.26'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify lock is consistent
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.detect.outputs.has_python == 'true' }}
        run: |
          uv lock --check
          uv sync --locked
      - name: Skip (no uv.lock)
        if: ${{ !cancelled() && steps.detect.outputs.lock_missing == 'true' }}
        run: echo "pyproject.toml present without uv.lock — lock consistency is NOT-RUN. Commit a lock when the plugin adds Python dependencies."
      - name: Skip (no pyproject.toml)
        if: ${{ !cancelled() && steps.detect.outputs.has_python == 'false' && steps.detect.outputs.lock_missing == 'false' }}
        run: echo "No pyproject.toml present — Python resolve is not applicable."
      - name: Validate skill-declared deps match manifests
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-skill-deps.py
